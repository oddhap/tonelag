name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Audit production dependency licenses
        run: pnpm licenses list --prod --json > frontend-licenses.json
      - name: Create frontend SBOM
        # cyclonedx-npm shells out to npm, whose tree validation does not
        # understand pnpm's node_modules layout. It can still inventory it.
        run: |
          if ! pnpm dlx @cyclonedx/cyclonedx-npm \
            --ignore-npm-errors \
            --output-reproducible \
            --output-file frontend.cdx.json \
            2>frontend-sbom.log; then
            cat frontend-sbom.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-supply-chain
          path: |
            frontend-licenses.json
            frontend.cdx.json

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            install: sudo apt-get update && sudo apt-get install -y libasound2-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          - os: macos-14
            install: brew install ffmpeg pkgconf
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: ${{ matrix.install }}
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  supply-chain:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
