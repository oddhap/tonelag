[advisories]
yanked = "deny"
# Tauri's Linux webview stack currently contains unavoidable transitive GTK3
# and rust-unic crates that RustSec marks unmaintained. Keep failing if a direct
# Tonelag dependency becomes unmaintained while still reporting transitives.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { crate = "ffmpeg-next@8.1.0", allow = ["WTFPL"] },
  { crate = "ffmpeg-sys-next@8.1.0", allow = ["WTFPL"] },
  { crate = "webpki-root-certs@1.0.8", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
